<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client History · Equipment Hire</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--bg2:#111418;--bg3:#181c24;--card:#1a1f2b;--border:#252d3d;--accent:#4a9eff;--accent2:#2d6fe0;--green:#2de08a;--red:#e0443a;--orange:#f5a623;--text:#e8ecf4;--muted:#6b7a96;--label:#9aa4b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.wrapper{max-width:1200px;margin:0 auto;padding:32px;position:relative;z-index:1}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.title{font:2.3rem 'Bebas Neue',sans-serif;letter-spacing:3px;background:linear-gradient(135deg,var(--accent) 0%,#fff 60%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.kpi-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-value{font:1.7rem 'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--accent)}
.client-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.client-card.flagged{border-left:4px solid var(--red)}
.client-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer;gap:14px;flex-wrap:wrap}
.client-name{font-weight:700;font-size:0.95rem}
.client-meta{font-size:.76rem;color:var(--muted);margin-top:3px}
.flag-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(224,68,58,.12);color:var(--red);border:1px solid rgba(224,68,58,.3);border-radius:20px;padding:2px 10px;font-size:.64rem;font-weight:700;text-transform:uppercase;margin-left:8px}
.client-stats{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.stat{text-align:right}
.stat-label{font-size:.62rem;color:var(--muted);text-transform:uppercase}
.stat-value{font-family:'JetBrains Mono',monospace;font-weight:700}
.client-body{display:none;border-top:1px solid var(--border);padding:14px 18px}
.client-body.open{display:block}
table.mini{width:100%;border-collapse:collapse;font-size:.78rem}
table.mini th{text-align:left;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--border);font-size:.65rem;text-transform:uppercase}
table.mini td{padding:7px 6px;border-bottom:1px solid rgba(37,45,61,.5)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:.62rem;font-weight:700;text-transform:uppercase}
.pill.paid{background:rgba(45,224,138,.12);color:var(--green)}
.pill.partial{background:rgba(245,166,35,.12);color:var(--orange)}
.pill.unpaid{background:rgba(224,68,58,.12);color:var(--red)}
.pill.overpaid{background:rgba(74,158,255,.12);color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:7px;color:var(--accent);text-decoration:none;background:var(--card)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:12px}
@media(max-width:800px){.kpi-strip{grid-template-columns:1fr 1fr}.wrapper{padding:20px 14px}}
/* -- PHONE -- */
@media(max-width:480px){
  .kpi-strip{grid-template-columns:1fr}
  .wrapper{padding:14px 8px}
  .title{font-size:1.9rem}
  .client-head{flex-direction:column;align-items:flex-start;gap:10px}
  .client-stats{width:100%;justify-content:space-between}
  .stat{text-align:left}
  table.mini{display:block;overflow-x:auto}
  .back span{display:none}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div><div class="title"><i class="fa-solid fa-users"></i> Client History</div><div class="subtitle">Repeat clients · payment reliability · flags before new contracts</div></div>
    <a class="back" href="mixers.html"><i class="fa-solid fa-arrow-left"></i> Equipment Hire Dashboard</a>
  </div>
  <div class="kpi-strip" id="kpiStrip"></div>
  <div id="clientList"></div>
</div>
<script src="src/mixer-nav.js"></script>
<script>
const request=async(path,options={})=>{const r=await fetch(path,{credentials:'include',...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
const fmt=n=>{n=Number(n||0);if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1)+'K';return n.toLocaleString()};
let clients=[];
let openKeys=new Set();

function renderKPIs(){
  const totalClients=clients.length;
  const flagged=clients.filter(c=>c.flagged).length;
  const totalOwed=clients.reduce((s,c)=>s+(c.totalOwed||0),0);
  const totalValue=clients.reduce((s,c)=>s+(c.totalValue||0),0);
  document.getElementById('kpiStrip').innerHTML=`
    <div class="kpi"><div class="kpi-label">Clients</div><div class="kpi-value">${totalClients}</div></div>
    <div class="kpi"><div class="kpi-label">Flagged for Review</div><div class="kpi-value" style="color:var(--red)">${flagged}</div></div>
    <div class="kpi"><div class="kpi-label">Outstanding Balance</div><div class="kpi-value" style="color:var(--orange)">${fmt(totalOwed)}</div></div>
    <div class="kpi"><div class="kpi-label">Lifetime Contract Value</div><div class="kpi-value" style="color:var(--green)">${fmt(totalValue)}</div></div>`;
}

function toggle(key){ if(openKeys.has(key)) openKeys.delete(key); else openKeys.add(key); render(); }

function render(){
  const list=document.getElementById('clientList');
  if(!clients.length){ list.innerHTML='<div class="empty-state"><i class="fa-solid fa-users" style="font-size:2rem;margin-bottom:10px;display:block;opacity:.3"></i><p>No contracts yet — client history builds up automatically as contracts are added.</p></div>'; return; }
  list.innerHTML=clients.map((c,i)=>{
    const key=c.clientName+i;
    const open=openKeys.has(key);
    const rows=(c.contracts||[]).map(ct=>`<tr>
      <td>${ct.startDate} → ${ct.endDate}</td>
      <td style="color:var(--green)">${fmt(ct.totalValue)}</td>
      <td style="color:var(--green)">${fmt(ct.paid)}</td>
      <td><span class="pill ${ct.paymentStatus}">${ct.paymentStatus}</span>${ct.overdue?' <span style="color:var(--red);font-size:.7rem">overdue</span>':''}</td>
      <td>${ct.returned?'Completed':'Active'}${ct.conditionStatus&&ct.conditionStatus!=='good'?` <span style="color:var(--orange);font-size:.7rem">(${ct.conditionStatus.replace('-',' ')})</span>`:''}</td>
    </tr>`).join('');
    return `<div class="client-card ${c.flagged?'flagged':''}">
      <div class="client-head" onclick="toggle('${key}')">
        <div>
          <div class="client-name">${c.clientName}${c.flagged?'<span class="flag-badge"><i class="fa-solid fa-flag"></i>Review</span>':''}</div>
          <div class="client-meta">${c.clientPhone||'No phone on file'} · ${c.totalContracts} contract${c.totalContracts!==1?'s':''} · last ended ${c.lastContractEnd}</div>
        </div>
        <div class="client-stats">
          <div class="stat"><div class="stat-label">Total Value</div><div class="stat-value" style="color:var(--green)">${fmt(c.totalValue)}</div></div>
          <div class="stat"><div class="stat-label">Paid</div><div class="stat-value" style="color:var(--accent)">${fmt(c.totalPaid)}</div></div>
          <div class="stat"><div class="stat-label">Owed</div><div class="stat-value" style="color:${c.totalOwed>0?'var(--red)':'var(--green)'}">${fmt(c.totalOwed)}</div></div>
          <i class="fa-solid fa-chevron-${open?'up':'down'}" style="color:var(--muted)"></i>
        </div>
      </div>
      <div class="client-body ${open?'open':''}">
        <table class="mini"><thead><tr><th>Dates</th><th>Value</th><th>Paid</th><th>Status</th><th>Return</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>`;
  }).join('');
}

(async()=>{
  try{ clients=await request('/api/contracts/clients/history'); }
  catch(e){ clients=[]; }
  renderKPIs();
  render();
})();
</script>
</body>
</html>
