<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mixer Reports</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b10;--card:#111a26;--border:#1e3550;--blue:#4a9eff;--text:#e8ecf4;--muted:#7890aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif}.wrapper{max-width:1300px;margin:0 auto;padding:32px;position:relative;z-index:1}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--border);margin-bottom:18px}.title{font-size:2.2rem;font-weight:700;color:var(--blue)}.subtitle{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:1px;margin-top:5px}.report-actions{display:flex;gap:8px;flex-wrap:wrap}.report-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #24476b;background:#102237;color:#b8d8f4;border-radius:7px;padding:9px 13px;cursor:pointer;font:600 .76rem 'Space Grotesk',sans-serif}.report-btn:hover{border-color:var(--blue);color:#70b5ff;background:#142c46}.year-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}.year-tab{border:1px solid #24476b;background:#0e1d2d;color:var(--muted);border-radius:7px;padding:8px 16px;cursor:pointer;font:600 .78rem 'Space Grotesk',sans-serif}.year-tab:hover,.year-tab.active{background:#17416b;border-color:var(--blue);color:#d9efff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}.card{background:rgba(15,26,40,.9);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 14px 35px rgba(0,0,0,.16)}.label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.value{font-size:1.9rem;font-weight:700;color:var(--blue);margin-top:7px}.section{margin-top:22px}.section h2{font-size:1.05rem;color:#d9efff}.table-wrap{overflow:auto;background:rgba(15,26,40,.88);border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid rgba(30,53,80,.7)}th{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}td.num{text-align:right;font-family:monospace}.empty{color:var(--muted);padding:24px}.error{color:#e0443a}@media(max-width:800px){.wrapper{padding:22px 14px}.header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.report-actions{width:100%}.report-btn{flex:1;justify-content:center}}@media print{body{background:#fff;color:#111}.wrapper{margin:0;padding:0;max-width:none}.report-actions,.year-tabs,#mixerNav,#mixerNavToggle{display:none!important}.card,.table-wrap{background:#fff;border:1px solid #bbb;box-shadow:none}.title,.value,.section h2{color:#111}.subtitle,.label,th{color:#555}td{border-bottom:1px solid #ddd}}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header"><div><div class="title"><i class="fa-solid fa-file-chart-column"></i> Mixer Reports</div><div class="subtitle" id="reportSubtitle">Equipment and hire performance · All Years</div></div><div class="report-actions"><button class="report-btn" id="csvButton"><i class="fa-solid fa-file-csv"></i>Export CSV</button><button class="report-btn" id="jsonButton"><i class="fa-solid fa-file-code"></i>Export JSON</button><button class="report-btn" onclick="window.print()"><i class="fa-solid fa-print"></i>Print</button></div></div>
  <div class="year-tabs" id="yearTabs"></div>
  <div class="grid" id="summary"></div>
  <div class="section"><h2>Equipment By Category</h2><div class="table-wrap"><table><thead><tr><th>Category</th><th>Total</th><th>Available</th><th>On Hire</th><th>Maintenance</th></tr></thead><tbody id="equipmentRows"></tbody></table></div></div>
  <div class="section"><h2 style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>Equipment Utilization</span><select id="utilWindow" style="font-size:.78rem;padding:6px 10px;border-radius:6px;border:1px solid #24476b;background:#0e1d2d;color:#b8d8f4"><option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="365">Last year</option></select></h2><div class="table-wrap"><table><thead><tr><th>Equipment</th><th>Category</th><th>Model</th><th>Days On Hire</th><th>Utilization</th><th>Income</th></tr></thead><tbody id="utilRows"></tbody></table></div></div>
  <div class="section"><h2>Hire Contracts</h2><div class="table-wrap"><table><thead><tr><th>Client</th><th>Dates</th><th>Status</th><th>Value</th></tr></thead><tbody id="contractRows"></tbody></table></div></div>
</div>
<script src="src/mixer-nav.js"></script>
<script>
const categories={mixer:'Concrete Mixers',scaffold:'Scaffold',compactor:'Compactor','gutter-mould':'Gutter Mould'};let equipment=[],contracts=[],year='all';const yearOf=value=>value?String(new Date(value).getFullYear()):null;const visible=()=>({eq:equipment.filter(e=>year==='all'||yearOf(e.createdAt)===year),ct:contracts.filter(c=>year==='all'||yearOf(c.startDate)===year||yearOf(c.endDate)===year)});
function availableYears(){return [...new Set([...equipment.map(e=>yearOf(e.createdAt)),...contracts.flatMap(c=>[yearOf(c.startDate),yearOf(c.endDate)])].filter(Boolean))].sort((a,b)=>Number(a)-Number(b))}
function renderYears(){const years=['all',...availableYears()];document.getElementById('yearTabs').innerHTML=years.map(v=>`<button class="year-tab ${year===v?'active':''}" data-year="${v}">${v==='all'?'All Years':v}</button>`).join('');document.querySelectorAll('.year-tab').forEach(button=>button.onclick=()=>{year=button.dataset.year;renderYears();render()})}
function render(){const data=visible(),active=data.ct.filter(c=>!c.returned),value=active.reduce((sum,c)=>sum+(c.totalValue||0),0);document.getElementById('reportSubtitle').textContent=`Equipment and hire performance · ${year==='all'?'All Years':year}`;document.getElementById('summary').innerHTML=`<div class="card"><div class="label">Equipment</div><div class="value">${data.eq.length}</div></div><div class="card"><div class="label">Active Contracts</div><div class="value">${active.length}</div></div><div class="card"><div class="label">Value On Hire</div><div class="value">${value.toLocaleString()}</div></div><div class="card"><div class="label">Maintenance Cost</div><div class="value">${data.eq.reduce((sum,e)=>sum+(e.cost?.maintenanceCost||0),0).toLocaleString()}</div></div>`;document.getElementById('equipmentRows').innerHTML=Object.keys(categories).map(category=>{const rows=data.eq.filter(e=>e.category===category);return `<tr><td>${categories[category]}</td><td>${rows.length}</td><td>${rows.filter(e=>e.status==='available').length}</td><td>${rows.filter(e=>e.status==='on-hire').length}</td><td>${rows.filter(e=>e.status==='maintenance').length}</td></tr>`}).join('');document.getElementById('contractRows').innerHTML=data.ct.length?data.ct.map(c=>`<tr><td>${c.clientName}</td><td>${c.startDate} to ${c.endDate}</td><td>${c.returned?'Completed':c.paymentStatus}</td><td class="num">${(c.totalValue||0).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No mixer contracts for this year.</td></tr>'}
function download(name,type,content){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([content],{type}));link.download=name;link.click();URL.revokeObjectURL(link.href)}function exportReport(format){const data=visible(),payload={year,equipment:data.eq,contracts:data.ct};if(format==='json')return download(`mixer-report-${year}.json`,'application/json',JSON.stringify(payload,null,2));const rows=[['Section','ID / Client','Category','Status','Start','End','Value']];data.eq.forEach(e=>rows.push(['Equipment',e.equipmentId,e.category,e.status,'','',e.cost?.pricePaid||0]));data.ct.forEach(c=>rows.push(['Contract',c.clientName,(c.items||[]).map(i=>i.category).join('|'),c.returned?'completed':c.paymentStatus,c.startDate,c.endDate,c.totalValue||0]));download(`mixer-report-${year}.csv`,'text/csv',rows.map(row=>row.map(value=>`"${String(value??'').replaceAll('"','""')}"`).join(',')).join('\n'))}
function renderUtilization(rows){document.getElementById('utilRows').innerHTML=rows.length?rows.map(r=>{const barColor=r.utilizationPct>=70?'#2de08a':r.utilizationPct>=35?'#f5a623':'#e0443a';return `<tr><td>${r.equipmentId}</td><td>${categories[r.category]||r.category||'—'}</td><td>${r.model||'—'}</td><td class="num">${r.daysOnHire} / ${r.daysTracked}</td><td><div style="display:flex;align-items:center;gap:8px;min-width:110px"><div style="flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden"><div style="width:${r.utilizationPct}%;height:100%;background:${barColor}"></div></div><span style="font-size:.72rem;color:${barColor};min-width:32px">${r.utilizationPct}%</span></div></td><td class="num">${r.income.toLocaleString()}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No equipment to report on yet.</td></tr>'}
async function loadUtilization(){try{const days=document.getElementById('utilWindow').value;const rows=await fetch(`/api/equipment/utilization?days=${days}`,{credentials:'include'}).then(r=>r.json());renderUtilization(Array.isArray(rows)?rows:[])}catch(error){document.getElementById('utilRows').innerHTML='<tr><td colspan="6" class="empty">Could not load utilization data.</td></tr>'}}
document.getElementById('utilWindow').addEventListener('change',loadUtilization);
document.getElementById('csvButton').onclick=()=>exportReport('csv');document.getElementById('jsonButton').onclick=()=>exportReport('json');(async()=>{try{[equipment,contracts]=await Promise.all([fetch('/api/equipment',{credentials:'include'}).then(r=>r.json()),fetch('/api/contracts',{credentials:'include'}).then(r=>r.json())]);renderYears();render();loadUtilization()}catch(error){document.getElementById('summary').innerHTML='<div class="card error">Could not load mixer reports.</div>'}})();
</script>
</body>
</html>
